server:
  port: 8080

spring:
  application:
    name: ticket-assistant
  datasource:
    url: jdbc:h2:mem:ticketsdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

llm:
  provider: mock
  timeout-ms: 5000
  openai:
    api-key: ${OPENAI_API_KEY:}
    base-url: https://api.openai.com/v1
    model: gpt-4o-mini
